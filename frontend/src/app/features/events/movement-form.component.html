<div class="head">
  <a [routerLink]="['..']">← Movimientos</a>
  <h1>Nuevo movimiento</h1>
  <p>El saldo se valida nuevamente en el servidor al guardar.</p>
</div>
<mat-card class="form-card"
  ><form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline"
      ><mat-label>Tipo</mat-label
      ><mat-select formControlName="type"
        ><mat-option *ngFor="let type of types" [value]="type">{{
          labels[type]
        }}</mat-option></mat-select
      ></mat-form-field
    ><mat-form-field appearance="outline" *ngIf="needsSource()"
      ><mat-label>Origen</mat-label
      ><mat-select formControlName="sourceLocationId"
        ><mat-option *ngFor="let location of locations()" [value]="location.id">{{
          location.name
        }}</mat-option></mat-select
      ></mat-form-field
    ><mat-form-field appearance="outline" *ngIf="needsDestination()"
      ><mat-label>Destino</mat-label
      ><mat-select formControlName="destinationLocationId"
        ><mat-option *ngFor="let location of locations()" [value]="location.id">{{
          location.name
        }}</mat-option></mat-select
      ></mat-form-field
    ><mat-form-field appearance="outline" class="wide"
      ><mat-label>Notas</mat-label><input matInput formControlName="notes" /></mat-form-field
    ><mat-checkbox *ngIf="canGenerateNote()" formControlName="generateDeliveryNote"
      >Generar albarán automáticamente</mat-checkbox
    >
    <div formArrayName="items" class="items">
      <div class="item" *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
        <mat-form-field appearance="outline"
          ><mat-label>Tipo de vaso</mat-label
          ><mat-select formControlName="cupTypeId"
            ><mat-option *ngFor="let cup of cups()" [value]="cup.id">{{
              cup.name
            }}</mat-option></mat-select
          ></mat-form-field
        ><mat-form-field appearance="outline"
          ><mat-label>Estado</mat-label
          ><mat-select formControlName="condition"
            ><mat-option value="CLEAN">Limpio</mat-option
            ><mat-option value="DIRTY">Sucio</mat-option
            ><mat-option value="DAMAGED">Dañado</mat-option></mat-select
          ></mat-form-field
        ><mat-form-field appearance="outline"
          ><mat-label>Cantidad</mat-label
          ><input matInput type="number" min="1" formControlName="quantity" /></mat-form-field
        ><button
          mat-button
          type="button"
          color="warn"
          (click)="removeItem(i)"
          *ngIf="items.length > 1"
        >
          Quitar
        </button>
      </div>
    </div>
    <button mat-button type="button" (click)="addItem()">+ Añadir línea</button>
    <div class="actions">
      <a mat-button [routerLink]="['..']">Cancelar</a
      ><button mat-flat-button color="primary" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando…' : 'Confirmar movimiento' }}
      </button>
    </div>
    <p class="error" *ngIf="error()">{{ error() }}</p>
  </form></mat-card
>
