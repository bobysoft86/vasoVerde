<div class="page-head">
  <div>
    <a routerLink="/events">← Eventos</a>
    <h1>{{ eventId ? 'Editar evento' : 'Nuevo evento' }}</h1>
    <p>Define los datos principales del evento operativo.</p>
  </div>
</div>
<mat-card class="form-card"
  ><form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline"
      ><mat-label>Nombre</mat-label><input matInput formControlName="name" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Código</mat-label><input matInput formControlName="code" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Ubicación</mat-label><input matInput formControlName="location" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Estado</mat-label
      ><mat-select formControlName="status"
        ><mat-option value="DRAFT">Borrador</mat-option
        ><mat-option value="PLANNED">Planificado</mat-option
        ><mat-option value="ACTIVE">Activo</mat-option
        ><mat-option value="FINISHED">Finalizado</mat-option
        ><mat-option value="CANCELLED">Cancelado</mat-option
        ><mat-option value="ARCHIVED">Archivado</mat-option></mat-select
      ></mat-form-field
    ><mat-form-field appearance="outline" class="wide"
      ><mat-label>Descripción</mat-label
      ><textarea matInput rows="3" formControlName="description"></textarea></mat-form-field
    ><label>Inicio <input type="date" formControlName="startDate" /></label
    ><label>Fin <input type="date" formControlName="endDate" /></label>
    <div class="actions">
      <a mat-button routerLink="/events">Cancelar</a
      ><button mat-flat-button color="primary" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando…' : 'Guardar evento' }}
      </button>
    </div>
  </form></mat-card
>
