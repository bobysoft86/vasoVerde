<main class="login-page">
  <mat-card class="login-card"
    ><div class="logo">VV</div>
    <h1>Bienvenido a Vaso Verde</h1>
    <p class="intro">Accede al panel de gestión de tu operación.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline"
        ><mat-label>Email</mat-label
        ><input matInput type="email" formControlName="email" autocomplete="email" /><mat-error
          >Introduce un email válido</mat-error
        ></mat-form-field
      ><mat-form-field appearance="outline"
        ><mat-label>Contraseña</mat-label
        ><input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        /><mat-error>La contraseña es obligatoria</mat-error></mat-form-field
      >
      <p class="error" *ngIf="error()">{{ error() }}</p>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Entrar al panel
        }
      </button>
    </form>
    <small>Demo: admin@ecocups.demo · Demo1234!</small></mat-card
  >
</main>
