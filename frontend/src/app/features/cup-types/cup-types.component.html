<div class="head">
  <div>
    <p class="eyebrow">CONFIGURACIÓN</p>
    <h1>Tipos de vaso</h1>
    <p>Catálogo de vasos reutilizables de la empresa.</p>
  </div>
  <button mat-flat-button color="primary" (click)="showForm.set(!showForm())">
    <mat-icon>add</mat-icon> Nuevo tipo
  </button>
</div>
<mat-card *ngIf="showForm()" class="form-card"
  ><form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline"
      ><mat-label>Nombre</mat-label><input matInput formControlName="name" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Código</mat-label><input matInput formControlName="code" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Capacidad (ml)</mat-label
      ><input matInput type="number" formControlName="capacityMl" /></mat-form-field
    ><button mat-flat-button color="primary" [disabled]="form.invalid">
      {{ editing() ? 'Actualizar' : 'Guardar' }}
    </button>
  </form></mat-card
>
<div class="list">
  <mat-card *ngFor="let item of items()"
    ><div>
      <strong>{{ item.name }}</strong
      ><small>{{ item.code }} · {{ item.capacityMl || '—' }} ml</small>
    </div>
    <span [class.off]="!item.active">{{ item.active ? 'Activo' : 'Inactivo' }}</span
    ><button mat-button (click)="edit(item)">Editar</button
    ><button mat-button color="warn" (click)="toggle(item)">
      {{ item.active ? 'Desactivar' : 'Activar' }}
    </button></mat-card
  >
</div>
